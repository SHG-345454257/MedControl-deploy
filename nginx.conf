server {
    listen 80;
    server_name medcontrol.localhost;
    return 308 https://medcontrol.localhost$request_uri;
}

server {
    listen 443 ssl;
    server_name medcontrol.localhost;

    ssl_certificate /etc/nginx/certs/medcontrol.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/medcontrol.localhost-key.pem;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://frontend:8080;
    }
}
